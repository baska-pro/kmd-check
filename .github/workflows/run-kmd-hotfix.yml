name: KMD Hotfix Validator

on:
  push:
    branches:
      - hotfix/gas-storage-staff-update

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/gas-storage-staff-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/apply_kmd_hotfix.py
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated result
        run: |
          rm -f scripts/apply_kmd_hotfix.py .github/workflows/run-kmd-hotfix.yml
          git config user.name "KMD Check Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "hotfix: restore CRUD, confirmations and staff feedback [skip ci]"
          git push origin HEAD:hotfix/gas-storage-staff-update
