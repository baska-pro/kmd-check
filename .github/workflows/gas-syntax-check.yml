name: GAS Syntax Check

on:
  push:
    branches:
      - hotfix/gas-storage-staff-update

jobs:
  gas-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Code.gs
        run: |
          cp public/gas/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Check binder
        run: |
          cp public/gas/KMD_Production_Bind.gs /tmp/KMD_Production_Bind.js
          node --check /tmp/KMD_Production_Bind.js
